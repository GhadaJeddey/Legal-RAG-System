version: '3.8'

services:
  postgres_db:
    image: pgvector/pgvector:pg17 # Official Postgres + pgvector pre-bundled image
    container_name: rag_postgres_db
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: rag_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: